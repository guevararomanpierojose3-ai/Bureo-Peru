<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" fill="#1E293B"/>
  <!-- Industrial conveyor belt view -->
  <path d="M20 160 L120 60 L280 60 L180 160 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="135" x2="210" y2="135" stroke="#64748B" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="80" y1="110" x2="240" y2="110" stroke="#64748B" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Material batches on belt -->
  <rect x="100" y="110" width="30" height="25" rx="3" fill="#2563EB" stroke="#60A5FA"/>
  <rect x="140" y="115" width="28" height="20" rx="3" fill="#059669" stroke="#34D399"/>
  <rect x="180" y="100" width="35" height="25" rx="3" fill="#DC2626" stroke="#F87171"/>
  <!-- Overlay alert crosshair -->
  <circle cx="197" cy="112" r="18" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 2" fill="#FEF2F2" fill-opacity="0.2"/>
  <!-- CCTV badge -->
  <rect x="10" y="10" width="130" height="20" rx="3" fill="#000000" fill-opacity="0.8"/>
  <text x="18" y="24" font-family="monospace" font-size="9" fill="#F87171">● CCTV-02 • BANDA CORTE</text>
</svg>
